[package]
name = "chainbound-artemis"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paradigmxyz/artemis"
readme = "README.md"

[dependencies]
alloy = { workspace = true, features = ["rpc-types"] }
artemis-core = { path = "../../artemis-core" }
fiber = { path = "../fiber" }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tokio = { version = "1.18", features = ["full"] }
async-trait = "0.1.64"
serde = "1.0.152"
anyhow = "1.0.70"
futures = "0.3"
tracing = "0.1.37"
reqwest = "0.11.20"
